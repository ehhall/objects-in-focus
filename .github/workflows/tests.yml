name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "papers/**", "figures/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "papers/**", "figures/**", "**.md"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The data folders are large and the unit tests build their own
          # miniature dataset, so keep checkouts shallow.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=oif --cov-report=term-missing

      - name: Check the CLI runs
        run: |
          oif --version
          oif --help
